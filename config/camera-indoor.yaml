# true 1 和 false 0 
width: 3072             #图像宽度
height: 2048            #图像高度
Offset_x: 0             #X方向偏置
Offset_y: 0             #Y方向偏置

FrameRateEnable: true   #使能 
FrameRate: 10           #帧率

ExposureTime: 50000     #曝光时间

GammaEnable: true
Gamma: 0.7              #伽马因子

GainAuto: 2             #亮度的固定增益

SaturationEnable: false
Saturation: 128          #饱和度

# GigE Transport Layer 参数
gev_scps_packet_size: 0           # 0=自动(推荐)，>0=固定值；巨帧可设 9000（需 MTU 支持）
gev_scpd: 0                       # Inter-Packet Delay，丢包时可增大
gev_heartbeat_timeout_ms: 30000   # 心跳超时，调试可增大避免断连

# 时间同步参数
use_device_timestamp: true        # 使用相机硬件时间戳打 stamp
device_ts_offset_calib: "first"   # 偏移标定方式：first(当前仅支持)
